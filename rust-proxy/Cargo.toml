[package]
name = "aegis-proxy"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
memmap2 = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
cc = "1"

[profile.release]
lto = true
codegen-units = 1
